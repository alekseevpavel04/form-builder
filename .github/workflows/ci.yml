name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      # The same two commands a reviewer runs, on a non-default port.
      - name: npm start answers on PORT
        shell: bash
        run: |
          PORT=4000 npm start > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:4000/admin; then exit 0; fi
            sleep 0.5
          done
          cat server.log
          exit 1
